name: Build VIZO MARIO PSX

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build unzip curl python3

      - name: Download PSn00bSDK prebuilt Linux package
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, os, re
          api = "https://api.github.com/repos/Lameguy64/PSn00bSDK/releases/latest"
          req = urllib.request.Request(api, headers={"Accept":"application/vnd.github+json","User-Agent":"VIZO-MARIO-PSX"})
          data = json.load(urllib.request.urlopen(req))
          assets = data.get("assets", [])
          candidates = [a for a in assets if "linux" in a["name"].lower() and a["name"].lower().endswith(".zip")]
          if not candidates:
              raise SystemExit("No Linux PSn00bSDK release ZIP found. Check the upstream release assets.")
          asset = candidates[0]
          req = urllib.request.Request(asset["browser_download_url"], headers={"User-Agent":"VIZO-MARIO-PSX"})
          with urllib.request.urlopen(req) as r, open("psn00bsdk.zip","wb") as f:
              f.write(r.read())
          print("Downloaded", asset["name"])
          PY
          mkdir -p "$HOME/psn00bsdk"
          unzip -q psn00bsdk.zip -d "$HOME/psn00bsdk"
          SDK_LIB="$(find "$HOME/psn00bsdk" -path '*/lib/libpsn00b/cmake/sdk.cmake' -print -quit)"
          if [ -z "$SDK_LIB" ]; then
            echo "Could not locate PSn00bSDK CMake toolchain."
            find "$HOME/psn00bsdk" -maxdepth 4 -type f | head -80
            exit 1
          fi
          SDK_ROOT="${SDK_LIB%/lib/libpsn00b/cmake/sdk.cmake}"
          echo "PSN00BSDK_LIBS=$SDK_ROOT/lib/libpsn00b" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake --preset default

      - name: Build BIN/CUE
        run: cmake --build build --verbose

      - name: Verify disc outputs
        run: |
          test -s build/VIZO_MARIO.bin
          test -s build/VIZO_MARIO.cue
          ls -lh build/VIZO_MARIO.bin build/VIZO_MARIO.cue build/vizo.exe

      - name: Upload BIN/CUE artifact
        uses: actions/upload-artifact@v4
        with:
          name: VIZO-MARIO-PSX-BIN-CUE
          path: |
            build/VIZO_MARIO.bin
            build/VIZO_MARIO.cue
            build/vizo.exe
          if-no-files-found: error

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/VIZO_MARIO.bin
            build/VIZO_MARIO.cue
            build/vizo.exe
